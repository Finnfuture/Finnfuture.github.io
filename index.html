<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 设置字符编码为 UTF-8，防止乱码 -->
    <meta charset="UTF-8">
    <!-- 视口设置：禁止用户缩放，适配移动端屏幕宽度 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>temp</title>
    <style>
        /* CSS 重置：去除所有元素默认的边距和填充 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        ::-webkit-scrollbar {
    display: none;
}
        /* body 和 html 占满全屏，背景纯黑，隐藏横向滚动条，鼠标变为十字准星 */
                body, html {
    width: 100%; 
    background: #000000;
    overflow-x: hidden; 
    /* --- 新增：禁止文本选择和长按菜单 --- */
    user-select: none;             /* 标准语法 */
    -webkit-user-select: none;     /* Chrome/Safari */
    -moz-user-select: none;        /* Firefox */
    -ms-user-select: none;         /* IE/Edge */
    -webkit-touch-callout: none;   /* iOS Safari: 禁止长按弹出链接/图片菜单 */
    /* 仅在非触摸设备上隐藏鼠标 */
    @media (hover: hover) { cursor: none; }
    -webkit-tap-highlight-color: transparent;
    /* 关键：禁止浏览器默认的触摸滚动行为，完全交由 JS 控制 */
    touch-action: none;
    overscroll-behavior: none;
    
}

        /* 新增：萤火虫绘制层，位于最顶层，不阻挡鼠标事件 */
        #firefly-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 让鼠标事件穿透到下层 */
            z-index: 9999;
        }


        /* 
           滚动容器：高度设为 350vh (视口高度的3.5倍)。
           这创造了“虚拟滚动条”，让用户可以向下滚动，从而触发 JS 中的相机移动逻辑。
        */
        #scroll-runtime-container { 
            height: 400vh; 
            width: 100%; 
            position: relative; 
        }

        /* 
           Canvas 容器：固定在屏幕左上角，覆盖整个屏幕。
           z-index: 1 确保它显示在其他内容之上（如果有的话）。
        */
        #canvas-container {
            position: fixed; 
            top: 0; 
            left: 0;
            width: 100%; 
            height: 100%; 
            z-index: 1;
        }
                /* --- 竖屏提示样式 --- */
        #orientation-warning {
            display: none; /* 默认隐藏 */
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000000;
            z-index: 10000; /* 确保在所有内容之上 */
            color: #fff;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: sans-serif;
        }

        .warning-content p {
            font-size: 18px;
            margin-bottom: 10px;
            opacity: 0.8;
        }
        
        .warning-content strong {
            font-size: 24px;
            color: #ffd700; /* 金色高亮 */
        }

        .icon {
            font-size: 40px;
            display: block;
            animation: rotate-icon 2s infinite linear;
        }

        @keyframes rotate-icon {
            from { transform: rotate(0deg); }
            to { transform: rotate(90deg); }
        }

        /* 【关键】仅当屏幕高度大于宽度（竖屏）时显示 */
        @media screen and (orientation: portrait) {
            #orientation-warning {
                display: flex;
            }
        }

    </style>
</head>
<body>
        <!-- 竖屏提示遮罩层 -->
    <div id="orientation-warning">
        <div class="warning-content">
            <p>请旋转手机至<br><strong>横屏模式</strong></p>
            <span class="icon">↻</span>
        </div>
    </div>

        <!-- 萤火虫特效层 -->

    <canvas id="firefly-canvas"></canvas>

    <!-- 滚动轨道 -->
    <div id="scroll-runtime-container">
        <!-- WebGL 渲染画布将被插入到这里 -->
        <div id="canvas-container"></div>
    </div>

    <!-- 
      Import Map: 告诉浏览器当代码中写 import ... from 'three' 时，
      去哪个 URL 下载 Three.js 库。
    -->
    <script type="importmap">
        { 
            "imports": { 
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js" 
            } 
        }
    </script>

    <!-- 主逻辑脚本：type="module" 允许使用 ES6 的 import 语法 -->
    <script type="module">
        // 从上面定义的 URL 导入 Three.js 核心库
        import * as THREE from 'three';
                // --- 萤火虫光标逻辑 ---
        
        const ffCanvas = document.getElementById('firefly-canvas');
        const ffCtx = ffCanvas.getContext('2d');
        let ffWidth, ffHeight;
        
        // 萤火虫粒子数组
        const fireflies = [];
        const FIREFLY_COUNT = 5; // 拖尾粒子的数量
        
        // 鼠标当前位置
        const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        
        // 监听鼠标移动更新目标位置
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        
function collectBrick(brick) {
    // 1. 将物品数据加入背包
    inventory.push({
        id: brick.userData.id,
        collectedTime: Date.now()
    });
    console.log("当前背包内容：", inventory);

    // 2. 从场景中彻底移除该玻璃砖网格
    scene.remove(brick);
    
    // 3. 从总数组和组中剔除，防止继续参与动画循环或碰撞
    const index = glassBricks.indexOf(brick);
    if (index > -1) {
        glassBricks.splice(index, 1);
    }

    // 4. 可选：触发震动反馈（移动端有效）
    if (navigator.vibrate) navigator.vibrate(50);
    
    // 5. 可选：你可以在这里调用前端UI展示，比如弹出提示“成功获得一块琥珀玻璃”
}

        // 检测点击玻璃砖的函数
function checkGlassBrickClick(clientX, clientY) {
    mouseVector.x = (clientX / window.innerWidth) * 2 - 1;
    mouseVector.y = -(clientY / window.innerHeight) * 2 + 1;
    
    raycaster.setFromCamera(mouseVector, camera);
    
    // 对 glassBricks 数组里的所有玻璃砖进行相交检测
    const intersects = raycaster.intersectObjects(glassBricks);
    
    if (intersects.length > 0) {
        // 获取被点击的第一块玻璃砖
        const clickedBrick = intersects[0].object;
        
        // 执行拾取逻辑
        collectBrick(clickedBrick);
        
        return true; // 表示点中了玻璃砖
    }
    return false;
}

        // 调整 Canvas 尺寸
        function resizeFirefly() {
            ffWidth = ffCanvas.width = window.innerWidth;
            ffHeight = ffCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeFirefly);
        resizeFirefly();

        // 萤火虫类
        class FireflyParticle {
            constructor(index) {
                this.index = index;
                this.x = mouse.x;
                this.y = mouse.y;
                this.size = Math.random() * 3 + 1; // 随机大小
                // 每个粒子有不同的滞后系数，形成拖尾
                this.ease = 0.1 + (index * 0.02); 
                this.angle = Math.random() * Math.PI * 2; // 随机初始角度
            }

            update() {
                // 1. 跟随逻辑：线性插值 (Lerp) 向鼠标位置移动
                // index 越大，ease 越大，跟得越紧？不，我们要反过来，index小的跟得紧
                // 这里我们让后面的粒子稍微有点随机扰动，看起来更像生物群
                const targetX = mouse.x;
                const targetY = mouse.y;
                
                // 计算距离
                const dx = targetX - this.x;
                const dy = targetY - this.y;
                
                // 简单的缓动跟随
                this.x += dx * this.ease;
                this.y += dy * this.ease;

                // 2. 增加一点自然的“抖动”或“环绕”，模拟昆虫飞行
                this.angle += 0.1;
                this.x += Math.sin(this.angle) * 0.5;
                this.y += Math.cos(this.angle) * 0.5;
            }

            draw(ctx) {
                // 根据索引计算透明度：头部的亮，尾部的暗
                const alpha = 1 - (this.index / FIREFLY_COUNT);
                // 头部大，尾部小
                const currentSize = this.size * (1 - (this.index / FIREFLY_COUNT) * 0.5);

                ctx.beginPath();
                // 径向渐变，制造发光感
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, currentSize * 4);
                gradient.addColorStop(0, `rgba(255, 220, 100, ${alpha})`);   // 核心亮黄
                gradient.addColorStop(0.4, `rgba(255, 180, 0, ${alpha * 0.5})`); // 中间橙色
                gradient.addColorStop(1, `rgba(255, 100, 0, 0)`);          // 边缘透明

                ctx.fillStyle = gradient;
                ctx.arc(this.x, this.y, currentSize * 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 初始化粒子
        for (let i = 0; i < FIREFLY_COUNT; i++) {
            fireflies.push(new FireflyParticle(i));
        }

        // 独立的萤火虫动画循环
        function animateFireflies() {
            ffCtx.clearRect(0, 0, ffWidth, ffHeight);
            
            // 使用加法混合模式，让重叠部分更亮（发光效果）
            ffCtx.globalCompositeOperation = 'lighter';

            fireflies.forEach(p => {
                p.update();
                p.draw(ffCtx);
            });

            // 恢复默认混合模式（虽然这里不需要，但保持好习惯）
            ffCtx.globalCompositeOperation = 'source-over';

            requestAnimationFrame(animateFireflies);
        }
        
        // 启动萤火虫动画
        if (window.matchMedia("(hover: hover)").matches) {
            animateFireflies();
        }

        // --- 1. 基础场景初始化 ---

        // 获取 HTML 中的 canvas 容器 div
        const container = document.getElementById('canvas-container');
        
        // 创建 Three.js 场景对象
        const scene = new THREE.Scene();

        // 定义雾的颜色 (黑色)
        const fogColor = new THREE.Color(0x000000); 
        
        // 设置场景背景色为黑色
        scene.background = fogColor;
        
        // 添加指数雾：颜色，起始距离(5)，结束距离(100)。
        // 物体超过100将完全不可见，用于隐藏远处地形的边缘。
        scene.fog = new THREE.Fog(fogColor, 10, 60);

        // 创建透视相机：视角45度，宽高比，近裁剪面0.1，远裁剪面200
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 200);
        
        // 定义相机的基础位置参数
        const baseCamX = 0, baseCamY = 4.5, baseCamZ = 12.0;
        
        // 设置相机初始位置 (x=0, y=4.5, z=12)
        camera.position.set(0, baseCamY, baseCamZ);

        // 创建 WebGL 渲染器
        const renderer = new THREE.WebGLRenderer({ 
            antialias: true, // 开启抗锯齿，让边缘更平滑
            powerPreference: "high-performance" // 优先使用高性能 GPU
        });
        
        // 设置渲染器尺寸为窗口大小
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        // 设置像素比：限制最大为2，防止在高分屏手机上性能过载
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        
        // 色调映射：使用电影级色调映射，让高光和阴影过渡更自然
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        
        // 曝光度：稍微调亮一点 (1.1)
        renderer.toneMappingExposure = 1.1;
        
        // 将渲染器的 canvas 元素添加到 HTML 容器中
        container.appendChild(renderer.domElement);

               // --- 2. 地形/海面网格 (ShaderMaterial) ---

        // 【优化1】降低几何体复杂度：从 256 降至 128。
        // 手机端 GPU 处理顶点位移非常消耗资源。
        // 为了不让画面变“平”，我们在 Shader 里提高了噪声频率。
        const geometry = new THREE.PlaneGeometry(200, 240, 64, 64); 
        
        // 将平面旋转 -90度，使其平铺在 XZ 平面上（默认是 XY 平面）
        geometry.rotateX(-Math.PI / 2);
        // --- 核心修复：将 Shader 的地形算法翻译到 JS，生成真实的物理碰撞体积 ---
        function fract(x) { return x - Math.floor(x); }
        function hash(x, y) { return fract(Math.sin(x * 12.9898 + y * 78.233) * 43758.5453); }
        function mix(a, b, t) { return a * (1.0 - t) + b * t; }
        function noise(x, y) {
            const ix = Math.floor(x), iy = Math.floor(y);
            const fx = fract(x), fy = fract(y);
            const ux = fx * fx * (3.0 - 2.0 * fx);
            const uy = fy * fy * (3.0 - 2.0 * fy);
            return mix(
                mix(hash(ix, iy), hash(ix + 1.0, iy), ux),
                mix(hash(ix, iy + 1.0), hash(ix + 1.0, iy + 1.0), ux), 
                uy
            );
        }
        function fbm(x, y) {
            let f = 0.0, amp = 0.5;
            for (let i = 0; i < 3; i++) {
                f += amp * noise(x, y); x *= 2.0; y *= 2.0; amp *= 0.5;
            }
            return f;
        }
        function getCpuElevation(x, z) {
            const sideZone = Math.max(0.0, Math.abs(x) - 14.0);
            const mountains = Math.pow(sideZone * 0.12, 1.6) * 2.8;
            const uvX = x * 0.1, uvY = z * 0.16;
            const qX = fbm(uvX, uvY), qY = fbm(uvX + 5.2, uvY + 1.3);
            const rX = fbm(uvX + qX * 2.0, uvY + qY * 2.0);
            const rY = fbm(uvX + qX * 2.0, uvY + qY * 2.0);
            const n = fbm(uvX + rX * 1.5, uvY + rY * 1.5);
            return mountains + n * n * 3.5;
        }

        // 修改网格的真实顶点高度
        const posAttr = geometry.attributes.position;
        for (let i = 0; i < posAttr.count; i++) {
            const x = posAttr.getX(i);
            const z = posAttr.getZ(i);
            posAttr.setY(i, getCpuElevation(x, z)); 
        }
        // 更新包围盒，确保射线检测范围生效
        geometry.computeBoundingBox();
        geometry.computeBoundingSphere();
        // -----------------------------------------------------------

        // 创建一个对象用于存储传递给 Shader 的统一变量 (Uniforms)
        const seaUniforms = { uTime: { value: 0 } };

        // 【优化2】提取公共 Shader 代码，避免 Vertex 和 Fragment 重复定义大段函数
        // 这能减少 Shader 编译时间和内存占用
        const commonShaderChunk = /* glsl */ `
            float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
            float noise(vec2 p) {
                vec2 i = floor(p); vec2 f = fract(p);
                vec2 u = f * f * (3.0 - 2.0 * f);
                return mix(mix(hash(i + vec2(0.0,0.0)), hash(i + vec2(1.0,0.0)), u.x),
                        mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), u.x), u.y);
            }
            float fbm(vec2 p) {
                float f = 0.0; float amp = 0.5;
                // 【优化3】移动端减少迭代次数：从 4 次减为 3 次
                // 视觉差异极小，但计算量减少 25%
                for(int i = 0; i < 3; i++) {
                    f += amp * noise(p); p *= 2.0; amp *= 0.5;
                }
                return f;
            }

            // 【优化4】提高噪声频率 (0.05->0.1, 0.08->0.16)
            // 因为网格变稀疏了，我们需要更密集的噪声纹理来填充细节
            float getElevation(vec2 p, float t) {
                float sideZone = max(0.0, abs(p.x) - 14.0);
                float mountains = pow(sideZone * 0.12, 1.6) * 2.8;
                
                // 频率加倍，补偿几何体精度的损失
                vec2 uv = p * vec2(0.1, 0.16); 
                vec2 q = vec2(fbm(uv - t * 0.06), fbm(uv + vec2(5.2, 1.3)));
                vec2 r = vec2(fbm(uv + q * 2.0 + t * 0.08), fbm(uv + q * 2.0 - t * 0.07));
                float n = fbm(uv + r * 1.5);
                
                float wave = n * n * 3.5; 
                return mountains + wave;
            }
        `;

        // === 地形顶点着色器 (Vertex Shader) ===
        const vertexShader = /* glsl */ `
            uniform float uTime;
            varying vec2 vUv;
            varying vec3 vViewPosition;
            varying vec3 vLocalPos;

            ${commonShaderChunk}

            void main() {
                vUv = uv;
                vec3 pos = position;
                
                // 使用优化后的 getElevation
                // pos.y += getElevation(pos.xz, 0.0);
                
                vLocalPos = pos;
                
                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                vViewPosition = -mvPosition.xyz;
                gl_Position = projectionMatrix * mvPosition;
            }
        `;

        // === 地形片元着色器 (Fragment Shader) ===
        const fragmentShader = /* glsl */ `
            uniform float uTime;
            varying vec2 vUv;
            varying vec3 vViewPosition;
            varying vec3 vLocalPos;

            ${commonShaderChunk}

            // 焦散效果函数：模拟水底的光纹
            float getCaustics(vec2 p, float t) {
                vec2 q = p * 0.12; 
                float c = 0.0;
                float w = 0.5;
                // 【优化5】减少循环次数：3次 -> 2次
                for (int i = 0; i < 2; i++) {
                    q += vec2(sin(q.y * 1.5 + t), cos(q.x * 1.5 - t)) * 0.5;
                    c += abs(sin(q.x) * cos(q.y)) * w;
                    w *= 0.6;
                    q *= 2.1; 
                }
                return pow(c, 3.5) * 3.0; 
            }

            void main() {
                vec2 p = vLocalPos.xz;
                float t = 0.0;

                // 计算法线 (Normal) - 保持原有逻辑，但依赖的是新的 getElevation
                float e = 0.05; 
                float mountains = pow(max(0.0, abs(p.x) - 14.0) * 0.12, 1.6) * 2.8;
                float h0 = getElevation(p, t);
                float hx = getElevation(p + vec2(e, 0.0), t);
                float hz = getElevation(p + vec2(0.0, e), t);
                vec3 normal = normalize(vec3((h0 - hx) / e, 1.0, (h0 - hz) / e));

                float pureWaveHeight = h0 - mountains;

                vec3 valleyColor = vec3(0.08, 0.12, 0.02);
                vec3 slopeColor  = vec3(0.01, 0.02, 0.005);
                vec3 peakColor   = vec3(0.0, 0.0, 0.0);

                float toSlope = smoothstep(0.0, 0.8, pureWaveHeight);
                float toPeak  = smoothstep(0.8, 2.5, pureWaveHeight);
                vec3 finalColor = mix(valleyColor, slopeColor, toSlope);
                finalColor = mix(finalColor, peakColor, toPeak);

                float ripples = getCaustics(p, uTime * 0.8);
                vec3 causticColor = vec3(0.4, 0.8, 0.3);
                finalColor += causticColor * ripples * (1.0 - toPeak) * 0.3 ;

                vec3 viewDir = normalize(vViewPosition);
                vec3 lightDir = normalize(vec3(0.5, 0.8, -0.5));
                vec3 halfVector = normalize(lightDir + viewDir);
                float NdotH = max(dot(normal, halfVector), 0.0);
                float specular = pow(NdotH, 30.0);
                
                finalColor += vec3(0.2, 0.3, 0.05) * specular * (1.0 - toPeak) * 0.4;

                float fresnel = pow(1.0 - max(dot(normal, viewDir), 0.0), 3.0);
                finalColor += vec3(0.05, 0.08, 0.02) * fresnel;

                float grain = (hash(gl_FragCoord.xy + uTime * 2.0) - 0.5) * 0.05;
                finalColor += vec3(grain);

                float sideMask = smoothstep(6.0, 40.0, abs(vLocalPos.x));
                finalColor = mix(finalColor, peakColor, sideMask);

                float dist = length(vViewPosition);
                float fog = smoothstep(20.0, 100.0, dist);
                finalColor = mix(finalColor, peakColor, fog);

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;
        
        const seaMaterial = new THREE.ShaderMaterial({
            vertexShader, 
            fragmentShader, 
            uniforms: seaUniforms, 
            transparent: false
        });
        scene.add(new THREE.Mesh(geometry, seaMaterial));


 // --- 3. 粒子系统 (Golden Spores) ---

        const particleCount = 8000; // 粒子总数
        const particleGeo = new THREE.BufferGeometry();
        
        // 创建位置数组：每个粒子有 x,y,z 三个坐标
        const pPositions = new Float32Array(particleCount * 3);
        
        // 定义粒子分布的范围
        const spreadX = 160; // X轴总宽度 (-80 到 80)
        const spreadZ = 300; // Z轴总长度 (-150 到 150)，拉长以覆盖更多滚动区域

        // 初始化粒子位置：均匀随机分布
        for (let i = 0; i < particleCount * 3; i += 3) {
            // Math.random() 生成 0-1，减去 0.5 变成 -0.5 到 0.5，再乘以总宽度
            pPositions[i]     = (Math.random() - 0.5) * spreadX; 
            pPositions[i + 1] = 0;                               
            pPositions[i + 2] = (Math.random() - 0.5) * spreadZ; 
        }
        // 将位置数据绑定到几何体
        particleGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));

// === 粒子顶点着色器 ===
        const particleVertex = /* glsl */ `
            uniform float uTime;
            varying vec3 vViewPosition;
            varying float vAlphaModifier; // 自定义变量：用于控制透明度
            varying float vTwinkle;       // 新增：闪烁因子

            // 再次复制噪声函数 (为了计算地形高度)
            float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
            float noise(vec2 p) {
                vec2 i = floor(p); vec2 f = fract(p);
                vec2 u = f * f * (3.0 - 2.0 * f);
                return mix(mix(hash(i + vec2(0.0,0.0)), hash(i + vec2(1.0,0.0)), u.x),
                        mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), u.x), u.y);
            }
            float fbm(vec2 p) {
                float f = 0.0; float amp = 0.5;
                for(int i = 0; i < 4; i++) {
                    f += amp * noise(p); p *= 2.0; amp *= 0.5;
                }
                return f;
            }
            float getElevation(vec2 p, float t) {
                float sideZone = max(0.0, abs(p.x) - 14.0);
                float mountains = pow(sideZone * 0.12, 1.6) * 2.8;
                vec2 uv = p * vec2(0.05, 0.08); 
                vec2 q = vec2(fbm(uv - t * 0.06), fbm(uv + vec2(5.2, 1.3)));
                vec2 r = vec2(fbm(uv + q * 2.0 + t * 0.08), fbm(uv + q * 2.0 - t * 0.07));
                float n = fbm(uv + r * 1.5);
                float wave = n * n * 3.5; 
                return mountains + wave;
            }

            void main() {
                vec3 pos = position;
                // 基于位置生成一个唯一的随机种子 (0.0 - 1.0)
                float seed = hash(pos.zx);

                // 1. 地形分析
                float sideZone = max(0.0, abs(pos.x) - 14.0);
                float mountains = pow(sideZone * 0.12, 1.6) * 2.8;
                // 获取当前粒子 XZ 位置对应的地面高度
                float surfaceHeight = getElevation(pos.xz, 0.0); 
                float pureWaveHeight = surfaceHeight - mountains;

                // 【核心逻辑 1】：谷底遮罩
                float valleyMask = 1.0 - smoothstep(0.0, 0.8, pureWaveHeight);

                // 【核心逻辑 2】：生命周期
                float speed = 0.03 + seed * 0.02; 
                float life = fract(uTime * speed + seed); 

                // 【核心逻辑 3】：上升运动
                float riseHeight = life * 15.0; 
                
                pos.x += sin(uTime * 0.3 + seed * 10.0) * life * 2.0;
                pos.z += cos(uTime * 0.2 + seed * 10.0) * life * 2.0;
                
                pos.y += surfaceHeight + riseHeight + 0.1;

                // 坐标变换
                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                vViewPosition = -mvPosition.xyz;
                gl_Position = projectionMatrix * mvPosition;

                // 设置粒子大小：近大远小
                float baseSize = 2.0 + seed * 2.5;
                gl_PointSize = baseSize * (50.0 / -mvPosition.z);
                
                float lifeAlpha = sin(life * 3.14159265); 
                vAlphaModifier = lifeAlpha; 

                // 【新增】计算闪烁效果：利用不同的频率和种子让每个粒子独立闪烁
                vTwinkle = sin(uTime * (3.0 + seed * 5.0) + seed * 6.28) * 0.5 + 0.01; // 归一化到 0~1
            }
        `;

// === 粒子片元着色器 ===
        const particleFragment = /* glsl */ `
            varying vec3 vViewPosition;
            varying float vAlphaModifier; 
            varying float vTwinkle; // 新增接收闪烁因子
            
            void main() {
                if (vAlphaModifier <= 0.01) discard; 

                vec2 coord = gl_PointCoord - vec2(0.5);
                float distFromCenter = length(coord); 
                if (distFromCenter > 0.5) discard; 
                
                float baseAlpha = pow(1.0 - (distFromCenter * 2.0), 1.8);
                
                float dist = length(vViewPosition);

                float nearFade = smoothstep(1.0, 3.0, dist);
                float farFog = smoothstep(5.0, 70.0, dist);
                
                if (farFog >= 1.0) discard; 

                vec3 color = vec3(1.0, 0.75, 0.1); 
                if (distFromCenter < 0.15) {
                    color = vec3(1.0, 0.9, 0.5); 
                }

                // 【修改】将闪烁因子 vTwinkle 乘入透明度，并调整闪烁深度（这里保持 0.4~1.0 的亮度抖动，避免完全灭掉）
                float twinkleFactor = mix(0.4, 1.0, vTwinkle);

                // 综合透明度：基础形状 * 生命周期 * 闪烁 * 近处淡出 * 远处雾气
                float finalAlpha = baseAlpha * vAlphaModifier * twinkleFactor * nearFade * (1.0 - farFog) * 0.8;
                
                gl_FragColor = vec4(color, finalAlpha);
            }
        `;


        // 创建粒子材质
        const particleMat = new THREE.ShaderMaterial({
            vertexShader: particleVertex, 
            fragmentShader: particleFragment,
            uniforms: { uTime: seaUniforms.uTime }, // 共用同一个时间变量
            transparent: true,
            blending: THREE.AdditiveBlending, // 加法混合：重叠部分会变亮，产生发光效果
            depthWrite: false, // 关闭深度写入：防止粒子互相遮挡，实现半透明叠加
            depthTest: false
        });
        
        // 将粒子添加到场景
        scene.add(new THREE.Points(particleGeo, particleMat));


// ==========================================
        // 新增：20个随机散落的 3D 玻璃砖资源位
        // ==========================================

        // 1. 添加基础光照（物理材质必须有光照才能呈现出折射和高光）
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 3.0);
        // 让光从侧上方打下来，能很好地照亮玻璃的边缘
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);
// ==========================================
        // 2. 配置高级琥珀材质
        // ==========================================
        const glassMaterial = new THREE.MeshPhysicalMaterial({
    color: 0xeef8ff,

    metalness: 0,
    roughness: 0.05,

    transmission: 1,
    ior: 1.5,

    thickness: 1.2,

    attenuationColor: 0xddeeff,
    attenuationDistance: 5,

    clearcoat: 1,
    clearcoatRoughness: 0.01,

    envMapIntensity: 1.5,

    transparent: true,
    side: THREE.DoubleSide
});

        // ==========================================
        // 3. 定义琥珀的形状：由高精度球体扰动而成的“不规则原石”
        // ==========================================
        const brickGeo = new THREE.SphereGeometry(0.25, 64, 64);
        const posAttribute = brickGeo.attributes.position;
        const vTemp = new THREE.Vector3();

        // 遍历所有顶点，用数学噪声“捏”出天然的凹凸起伏
        for (let i = 0; i < posAttribute.count; i++) {
            vTemp.fromBufferAttribute(posAttribute, i);
            const dir = vTemp.clone().normalize();
            
            // 组合不同频率的三角函数，模拟自然界的不规则结核
            const noise = Math.sin(vTemp.x * 20) * Math.cos(vTemp.y * 15) * Math.sin(vTemp.z * 10);
            const lumpiness = 0.04 * noise; // 决定凹凸的强度
            
            // 沿法线方向偏移顶点
            vTemp.addScaledVector(dir, lumpiness);
            posAttribute.setXYZ(i, vTemp.x, vTemp.y, vTemp.z);
        }
        // 重新计算法线，否则表面折射和光照会出错（至关重要）
        brickGeo.computeVertexNormals();
        
        const glassBricks = []; 
        const brickGroup = new THREE.Group();
        scene.add(brickGroup);

        const BRICK_COUNT = 20; // 资源位数量

        // ==========================================
        // 4. 循环生成并随机散落
        // ==========================================
        for (let i = 0; i < BRICK_COUNT; i++) {
            const brick = new THREE.Mesh(brickGeo, glassMaterial);

            // 【新增】随机非等比缩放：让每一块琥珀看起来形态各异
            brick.scale.set(
                1.0 + Math.random() * 0.4, // X轴
                0.6 + Math.random() * 0.4, // Y轴 (压扁一点，像天然水滴或卵石)
                1.0 + Math.random() * 0.6  // Z轴
            );

            // 随机坐标生成
            const randomX = (Math.random() - 0.5) * 45;
            const randomZ = 5 - Math.random() * 155;
            const surfaceY = getCpuElevation(randomX, randomZ);
const randomY = surfaceY + 0.2;

            brick.position.set(randomX, randomY, randomZ);

            // 随机初始旋转角度
            brick.rotation.set(
                Math.random() * Math.PI,
                Math.random() * Math.PI,
                Math.random() * Math.PI
            );

            // 保存自定义数据
            brick.userData = {
                id: i, 
                rotSpeedX: (Math.random() - 0.5) * 0.01, 
                rotSpeedY: (Math.random() - 0.5) * 0.01, 
                baseY: randomY,                          
                floatSpeed: 0.5 + Math.random() * 1.0,   
                floatOffset: Math.random() * Math.PI * 2 
            };

            brickGroup.add(brick);
            glassBricks.push(brick);
        }
// ==========================================
        // 4. 统一交互逻辑 (Pointer API 优化版)
        // ==========================================

        let isDragging = false;
        let startX = 0, startY = 0;
        let startCamX = 0, startCamZ = 0;
        
        let targetScrollY = 0, currentScrollY = 0;
        let mouseX = 0, targetMouseX = 0;
        let mouseY = 0, targetMouseY = 0;
        
        // 交互阈值与状态
        let longPressTimer = null;
        const LONG_PRESS_DELAY = 400; // 长按触发时间 (ms)
        const DRAG_THRESHOLD = 5;     // 拖拽判定阈值 (px)
        let lastFocusTime = 0;        // 记录最后一次触发聚焦的时间戳

        // 聚焦状态
        let isFocused = false;
        let focusTarget = new THREE.Vector3(0, 0, 0);
        let spherical = { radius: 12, theta: 0, phi: Math.PI / 3 };
        let currentLookAt = new THREE.Vector3(0, -0.5, -30);
        const raycaster = new THREE.Raycaster();
        const mouseVector = new THREE.Vector2();
        
        // 获取地形网格进行射线检测
        const terrainMesh = scene.children.find(obj => obj.type === 'Mesh'); 

        // 灵敏度配置
        const DRAG_SENSITIVITY = 0.05; 
        const ROTATE_SENSITIVITY = 0.01;

 function triggerFocus(clientX, clientY) { // 或者 function triggerFocus(pos) 
            mouseVector.x = (clientX / window.innerWidth) * 2 - 1;
            mouseVector.y = -(clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouseVector, camera);
            const intersects = raycaster.intersectObject(terrainMesh);
            
            if (intersects.length > 0) {
                isFocused = true;
                focusTarget.copy(intersects[0].point);
                
                // 【调整这里】
                // 如果你想完全精准对齐点击的地面，直接注释掉或者删掉下面这行：
                // focusTarget.y += 1.5; 
                
                // 或者你可以改成一个更小的微调值，比如 0.5，让它稍稍抬起一点点
                focusTarget.y -= 0.5; 
                
                // 重置观察极坐标
                spherical.radius = 12.0;
                spherical.theta = 0;
                spherical.phi = Math.PI / 3;
                
                lastFocusTime = Date.now(); 

                if (navigator.vibrate) navigator.vibrate(30); 
            }
        }

        function onPointerDown(e) {
            // 忽略鼠标右键
            if (e.button === 2) return; 
            
            startX = e.clientX;
            startY = e.clientY;
            startCamZ = baseCamZ - (currentScrollY * 0.025);
            startCamX = mouseX * 4.0;
            
            targetScrollY = currentScrollY; 
            isDragging = false; 

// 清除之前的定时器
            if (longPressTimer) clearTimeout(longPressTimer);
            
            // ==========================================
            // 【修改处】拦截逻辑：
            // 1. 检查当前是否点击在屏幕上半部分 (startY < window.innerHeight * 0.5)
            // 2. 如果满足，则直接跳过，不注册长按聚焦
            // ==========================================
            const isTopHalf = startY < window.innerHeight * 0.45;

            // 如果不在聚焦模式，且不是点击在上半部分，才启动长按判定
            if (!isFocused && !isTopHalf) {
                longPressTimer = setTimeout(() => {
                    if (!isDragging) {
                        triggerFocus(startX, startY);
                    }
                }, LONG_PRESS_DELAY);
            }
        }

   function onPointerMove(e) {
            // PC 端悬停效果 (未按下的状态)
            if (e.pointerType === 'mouse' && e.buttons === 0) {
                targetMouseX = (e.clientX / window.innerWidth) * 2 - 1;
                targetMouseY = -(e.clientY / window.innerHeight) * 2 + 1;
                return;
            }

            // 计算滑动距离
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;
            const moveDist = Math.hypot(deltaX, deltaY);

            // 超过阈值判定为拖拽
            if (moveDist > DRAG_THRESHOLD && !isDragging) {
                isDragging = true;
                if (longPressTimer) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }
            }

            if (isDragging) {
                if (e.cancelable) e.preventDefault(); 

                if (isFocused) {
                    // --- 聚焦模式：模拟游戏环绕视角 (固定高度) ---
                    
                    // 仅使用横向滑动 (deltaX) 来控制水平旋转角 (theta)
                    // 注意这里使用 -= ：手指/鼠标向左滑时，相机向右绕，视野向左看。这符合绝大多数 3D 手游的视角控制习惯
                    spherical.theta -= deltaX * ROTATE_SENSITIVITY; 
                    
                    // 我们不修改 spherical.phi (垂直角) 和 spherical.radius (距离)
                    // 因为它们已经在 triggerFocus 中被固定 (例如 phi = Math.PI / 3)
                    // 这样相机的绝对高度就完全被锁死了

                    // 更新起始点，保证连续滑动的连贯性
                    startX = e.clientX;
                    startY = e.clientY;

                } else {
                    // --- 漫游模式：前后平移 ---
                    const newCamZ = startCamZ - (deltaY * DRAG_SENSITIVITY);
                    targetScrollY = (baseCamZ - newCamZ) / 0.025;
                    
                    const maxScroll = window.innerHeight * 3; 
                    targetScrollY = Math.max(0, Math.min(targetScrollY, maxScroll));
                }
            }
        }
        function onPointerUp(e) {
    if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
    }

    const wasDragging = isDragging;
    isDragging = false;

    // 【新增】如果刚才没有发生拖拽（即判定为纯点击/轻触），先检测有没有点中玻璃砖
    if (!wasDragging) {
        const hitBrick = checkGlassBrickClick(e.clientX, e.clientY);
        if (hitBrick) {
            return; // 如果点中了玻璃砖并收进了背包，就不再执行后面的漫游/聚焦逻辑
        }
    }

    // 退出聚焦逻辑：未拖拽(轻触) + 当前处于聚焦 + 距离上次触发超过 500ms(防误退)
    if (!wasDragging && isFocused) {
        const timeSinceFocus = Date.now() - lastFocusTime;
        if (timeSinceFocus > 500) {
            isFocused = false;
            if (navigator.vibrate) navigator.vibrate(15);
        }
    }

    startCamZ = baseCamZ - (targetScrollY * 0.025);
    startCamX = targetMouseX * 4.0;
}
        // 使用 Pointer Events 替代 mouse 和 touch
        window.addEventListener('pointerdown', onPointerDown, { passive: false });
        window.addEventListener('pointermove', onPointerMove, { passive: false });
        window.addEventListener('pointerup', onPointerUp);
        window.addEventListener('pointercancel', onPointerUp); // 处理意外中断
        
        window.addEventListener('contextmenu', e => e.preventDefault());
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            resizeFirefly();
        });

        // --- 5. 动画循环 ---
        const clock = new THREE.Clock();
        const v3Temp = new THREE.Vector3();

        // 【新增】定义山谷边界 (Camera Walls)
        // 根据 Shader: float sideZone = max(0.0, abs(p.x) - 14.0);
        // 山谷中心在 0，两侧山脉在 +/- 14 开始升起。
        // 我们设置墙壁在 +/- 12.5，留出一点缓冲空间，防止看到山体内部或黑边。
        const WALL_LEFT = -2;
        const WALL_RIGHT = 2;
function clamp(val, min, max) {
            return Math.max(min, Math.min(max, val));
        }

        function tick() {
            const time = clock.getElapsedTime();
            seaUniforms.uTime.value = time;

            // 物理平滑过渡更新
            if (isDragging) {
                currentScrollY = targetScrollY;
                mouseX = targetMouseX;
                mouseY = targetMouseY;
            } else {
                currentScrollY += (targetScrollY - currentScrollY) * 0.08;
                mouseX += (targetMouseX - mouseX) * 0.05;
                mouseY += (targetMouseY - mouseY) * 0.05;
            }

            // ==========================================
            // 计算目标位置与注视点
            // ==========================================
            if (isFocused) {
                // --- 聚焦模式 (完全释放 X 轴限制，允许 360 度画圆) ---
                const sinPhi = Math.sin(spherical.phi);
                const cosPhi = Math.cos(spherical.phi);
                const sinTheta = Math.sin(spherical.theta);
                const cosTheta = Math.cos(spherical.theta);

                const offsetX = spherical.radius * sinPhi * sinTheta;
                const offsetY = spherical.radius * cosPhi;
                const offsetZ = spherical.radius * sinPhi * cosTheta;

                v3Temp.set(
                    focusTarget.x + offsetX,
                    focusTarget.y + offsetY,
                    focusTarget.z + offsetZ
                );
                
                if (isDragging) {
                    camera.position.copy(v3Temp);
                    // 【优化】拖拽时视角直接死锁目标，消除延迟导致的眩晕感
                    currentLookAt.copy(focusTarget); 
                } else {
                    camera.position.lerp(v3Temp, 0.1);
                    currentLookAt.lerp(focusTarget, 0.1);
                }

            } else {
                // --- 正常漫游模式 ---
                const scrollBasedZ = baseCamZ - (currentScrollY * 0.025);
                const scrollBasedY = baseCamY + (currentScrollY * 0.0005);
                
                let targetX = 0; 
                v3Temp.set(targetX, scrollBasedY, scrollBasedZ);
                
                if (isDragging) {
                    camera.position.copy(v3Temp);
                } else {
                    camera.position.lerp(v3Temp, 0.05);
                }

                // 漫游时的前方注视点
                const targetLookY = -0.5 - mouseY * 1.5; 
                const targetLookZ = camera.position.z - 30;
                
                v3Temp.set(0, targetLookY, targetLookZ);
                
                if (isDragging) {
                    currentLookAt.copy(v3Temp);
                } else {
                    currentLookAt.lerp(v3Temp, 0.05);
                }

                // ==========================================
                // 【核心修复】边界限制 (Camera Walls) 仅在漫游时生效
                // ==========================================
                let currentX = camera.position.x;
                if (currentX < WALL_LEFT || currentX > WALL_RIGHT) {
                    camera.position.x = clamp(currentX, WALL_LEFT, WALL_RIGHT);
                }
            }

            // 最后应用注视点
            camera.lookAt(currentLookAt);
// ==========================================
            // 更新玻璃砖的悬浮与自转动画
            // ==========================================
            glassBricks.forEach(brick => {
                const data = brick.userData;
                // // 缓慢自转
                // brick.rotation.x += data.rotSpeedX;
                // brick.rotation.y += data.rotSpeedY;
                
                // // 正弦波上下呼吸悬浮动画
                // // 根据当前时间和随机属性，产生高低起伏
                // brick.position.y = data.baseY + Math.sin(time * data.floatSpeed + data.floatOffset) * 0.05;
            });

            // 原有代码
            renderer.render(scene, camera);
            requestAnimationFrame(tick);
        }
        
        tick();
    </script>
