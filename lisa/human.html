<!DOCTYPE html>
<!--
  Lisa · 精简版页面：仅保留 3D 人物模型 + 声音相关代码
  · 3D 模型：./lisa.glb     环境贴图：./envmap.exr
  · 屏幕代码纹理：./running_code.mp4（“闪屏”里的代码窗口贴图，本地文件）
  · 表情视频：走网络（表情.txt 里的 mux 直播流，已在 app.js 的 LISA_EXPRESSIONS 中配置）
  · 环境音：./ambient.mp3
  · 交互：
      1) 首次加载显示原来的 “[CLICK] TO START”，鼠标点击 / 按键（或声音自动播放成功）后开始；
      2) 每次切换都会走原来的“闪屏”过渡（glitch + 代码窗口拉满后回落）；
      3) 鼠标向右移动 → 换屏幕右半边的表情视频，向左移动 → 换左半边，左右各自轮换；
      4) 鼠标静止 7~16 秒会像原来一样自动换一个表情或回到 setIdle() 随机内容。
       5) 语音输入（VAD + ASR，实现见 asr.js）：首次点击 / 按键之后自动开麦常听，
          一说话就自动识别、边说边出字，停顿约 0.8s 自动收句；右下角麦克风按钮可随时开 / 关。
          注意：浏览器只在 https 或 http://localhost 下才允许使用麦克风。
       6) 识别引擎默认是「本机离线」的 Vosk（./vosk/vosk.js + ./vosk/model.vosk，约 49MB）：
          模型跑在浏览器 WASM 里，**断网也能识别、音频不出本机**；
          想切回浏览器自带识别（Chrome→Google 云端）就把 asr.js 顶部 CFG.engine 改成 'webspeech'。
          注意：模型文件**故意不叫 .tar.gz**（叫 .tar.gz 会被 IDM 之类下载管理器拦截，浏览器只能
          拿到空文件，库就会报 "Folder does not contain model files"，然后一直卡在加载）。
       7) 识别结果用「对白层（弹幕）」展示：底部升起的白色面板 + 大字号 + 乱码落定 + 闪烁光标，
          视觉直接复用 main.css 里原站的 .c-lisa_main / .c-lisa-step_dialog / .-show-cursor 光标，
          逻辑在 asr.js（由 window 的 'lisa-voice' 事件驱动；说过的句子淡一档往上顶，最多留 3 行）。
       8) 端侧 GPU 小模型（llm.js + ./llm/，WebGPU / WebLLM）：Qwen2.5-0.5B-Instruct q4f16，
          引擎 6.6MB + WebGPU 计算库 4.6MB + 权重 276MB 全在本地，**断网可用、数据不出本机**；
          听到你说完一整句就用显卡生成回复，回复以流式打字进入上面的对白层（蓝色）。
          需要 Chrome / Edge 113+（WebGPU）；模型在显存里约占 950MB，首次编译着色器要十几秒，
          之后走 IndexedDB 缓存。接口：window.lisaLLM.ask/state/abort/reset，事件 'lisa-llm'。
  · 必须通过本地 HTTP 服务访问（例如 `python -m http.server 8000` 或 `npx serve`）。
    直接双击以 file:// 打开时，浏览器会因 CORS 拦截 .glb / .mp4 / .mp3 / .exr 的加载。
-->
<html class="js-focus-visible is-loaded is-ready" lang="en" data-template="lisa" data-theme="lisa">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">

    <title>Lisa</title>

    <meta name="description" content="Lisa - 3D model">

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="HandheldFriendly" content="true">

    <!-- Appearance -->
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
    <meta name="theme-color" content="#ffffff">

    <!-- 基础重置（只保留 3D 模型容器 / canvas / 声音按钮所需的部分，主题变量主体在 main.css） -->
    <style>
        html {
            box-sizing: border-box;
            min-height: 100%;
            line-height: 1.3;
            color: var(--color);
            background-color: var(--color-bg);
            -webkit-text-size-adjust: 100%;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale
        }

        *,
        :before,
        :after {
            box-sizing: inherit
        }

        body {
            margin: 0;
            width: 100%
        }

        main {
            display: block
        }

        :root {
            --color: #000000;
            --color-bg: #FFFFFF;
            --font-size: 15px
        }

        html[data-theme=lisa] {
            --color-bg: #FFFFFF;
            --color: #000000
        }

        /* 字体改成本地相对路径：main.css 里用的是 /xxx.woff2 这种根路径，
           服务不在根目录/根目录没有这些文件时会 403/404（控制台会一直在报错） */
        @font-face {
            font-display: swap;
            font-family: "HelveticaNowDisplay";
            src: url("./PPLocomotiveNew-Light.woff2") format("woff2"),
                url("./HelveticaNowDisplay-Regular.woff2") format("woff2");
            font-weight: 400;
            font-style: normal
        }

        @font-face {
            font-display: swap;
            font-family: "LocomotiveNew";
            src: url("./PPLocomotiveNew-Light.woff2") format("woff2");
            font-weight: 400;
            font-style: normal
        }

        audio,
        canvas,
        iframe,
        img,
        svg,
        video {
            vertical-align: middle
        }

        img,
        svg {
            max-width: 100%;
            height: auto
        }

        svg {
            fill: currentColor
        }

        [hidden],
        template {
            display: none
        }

        button {
            display: inline-block;
            overflow: visible;
            margin: 0;
            padding: 0;
            outline: 0;
            border: 0;
            background: none rgba(0, 0, 0, 0);
            color: inherit;
            vertical-align: middle;
            text-align: center;
            text-decoration: none;
            text-transform: none;
            font: inherit;
            line-height: normal;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
            -webkit-appearance: button;
            -moz-appearance: none;
            appearance: none
        }

        ::selection {
            background-color: var(--color);
            color: var(--color-bg)
        }

        /* app.js 的启动流程会读取 #preloader / #preloaderHead / #preloaderContent / #preloaderLogo，
           这里保留空壳（不含任何品牌 Logo），启动后自动淡出并移除 */
        .c-preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            z-index: 9999;
            transition: opacity .9s cubic-bezier(.215, .61, .355, 1)
        }

        .c-preloader_outer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .c-preloader_logo {
            display: block
        }

        html:not(.is-first-loading) .c-preloader {
            opacity: 0;
            pointer-events: none
        }

        /* ==================================================================
           语音输入（VAD + ASR）：麦克风按钮 / 声波 / 底部实时字幕 / 提示条
           逻辑全在 asr.js 里（纯前端、零依赖，不改 app.js）
           ================================================================== */

        /* 右下角麦克风按钮：正好压在声音按钮（bottom:18px）上面 */
        .c-lisa_voice {
            position: fixed;
            right: 18px;
            bottom: 78px;
            z-index: 2147483647;
            width: 48px;
            height: 48px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity .25s ease, background-color .25s ease, box-shadow .25s ease
        }

        .c-lisa_voice.is-off {
            opacity: .5
        }

        .c-lisa_voice.is-load {
            opacity: .7
        }

        .c-lisa_voice.is-bad {
            background: #c62828;
            opacity: 1
        }

        /* 说话中：按钮外面一圈脉冲，一眼能看出“正在听” */
        .c-lisa_voice.is-speak {
            opacity: 1;
            animation: c-lisa_voice-pulse 1.15s ease-out infinite
        }

        @keyframes c-lisa_voice-pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(0, 0, 0, .5)
            }

            70% {
                box-shadow: 0 0 0 12px rgba(0, 0, 0, 0)
            }

            100% {
                box-shadow: 0 0 0 0 rgba(0, 0, 0, 0)
            }
        }

        .c-lisa_voice svg {
            fill: #fff;
            width: 24px;
            height: 24px;
            display: block
        }

        /* 说话时替换图标的那 4 根声波（高度由 asr.js 按音量实时改） */
        .c-lisa_voice-bars {
            display: none;
            align-items: flex-end;
            height: 20px
        }

        .c-lisa_voice-bars i {
            display: block;
            width: 3px;
            height: 3px;
            margin-right: 3px;
            border-radius: 2px;
            background: #fff;
            transition: height .08s linear
        }

        .c-lisa_voice-bars i:last-child {
            margin-right: 0
        }

        /* 底部居中的实时字幕条（已定稿=白色，草稿=灰色 + 光标） */
        .c-lisa_voice-bar {
            position: fixed;
            left: 50%;
            bottom: 92px;
            z-index: 2147483646;
            transform: translate(-50%, 10px);
            max-width: calc(100vw - 160px);
            max-width: min(680px, calc(100vw - 160px));
            padding: 10px 18px;
            border-radius: 14px;
            background: rgba(0, 0, 0, .78);
            color: #fff;
            font-family: "HelveticaNowDisplay", system-ui, -apple-system, "Microsoft YaHei", sans-serif;
            font-size: 15px;
            line-height: 1.6;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity .3s ease, transform .3s ease
        }

        .c-lisa_voice-bar.is-show {
            opacity: 1;
            transform: translate(-50%, 0)
        }

        .c-lisa_voice-prev {
            display: block;
            font-size: 13px;
            opacity: .5;
            margin-bottom: 2px
        }

        .c-lisa_voice-draft {
            opacity: .6
        }

        .c-lisa_voice-caret {
            display: inline-block;
            width: 2px;
            height: 1em;
            margin-left: 2px;
            background: #fff;
            vertical-align: -2px;
            animation: c-lisa_voice-caret .9s steps(1) infinite
        }

        @keyframes c-lisa_voice-caret {

            0%,
            49% {
                opacity: 1
            }

            50%,
            100% {
                opacity: 0
            }
        }

        /* 只有“麦克风被拒 / 连不上识别服务 / 浏览器不支持”时才出现的顶部提示条，点一下关掉 */
        .c-lisa_voice-tip {
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            z-index: 2147483647;
            display: none;
            padding: 14px 44px 16px 20px;
            background: rgba(0, 0, 0, .9);
            color: #fff;
            font: 14px/1.75 system-ui, -apple-system, "Microsoft YaHei", sans-serif;
            cursor: pointer
        }

        .c-lisa_voice-tip.is-show {
            display: block
        }

        .c-lisa_voice-tip b {
            color: #ffd166
        }

        .c-lisa_voice-tip code {
            color: #8ecae6;
            word-break: break-all
        }

        .c-lisa_voice-tip-close {
            position: absolute;
            right: 16px;
            top: 12px;
            opacity: .7
        }

        /* ==================================================================
           Lisa 对白层（弹幕）
           直接复用 main.css 里原站的 .c-lisa_main / .c-lisa-step / .c-lisa-step_dialog
           与 .-show-cursor 的闪烁光标，这里只做必要覆盖：
           #lisa-say 是 id 选择器，特异性高于 main.css 的类选择器，所以能稳定生效
           ================================================================== */
        #lisa-say {
            position: fixed;
            inset: auto 0 0 0;
            width: 100%;
            max-height: 62vh;
            z-index: 900;
            padding: 18px var(--grid-margin) 22px;
            background-color: var(--color-bg, #fff);
            color: var(--color, #000);
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            box-shadow: 0 -18px 60px rgba(0, 0, 0, .16);
            opacity: 0;
            transform: translate3d(0, 103%, 0);
            transition: transform .45s cubic-bezier(.215, .61, .355, 1), opacity .3s ease;
            pointer-events: none;
            overflow: auto;
            -webkit-overflow-scrolling: touch
        }

        #lisa-say.is-on {
            opacity: 1;
            transform: translate3d(0, 0, 0)
        }

        /* 原站 .c-lisa-step 是「半屏留白 + 断点字号」，这里换成适合弹幕的紧凑排版 */
        #lisa-say .c-lisa-step {
            padding: 0;
            margin: 0;
            min-height: 0;
            overflow: visible;
            --dialog-font-size: clamp(19px, 2.6vw, 32px)
        }

        /* 一行 = 一句；说过的句子淡一点往上顶，当前这句最亮 */
        #lisa-say .c-lisa-step_dialog {
            margin: 0 0 .3em;
            color: rgba(0, 0, 0, .34);
            transition: color .25s ease
        }

        #lisa-say .c-lisa-step_dialog.is-current {
            color: var(--color, #000)
        }

        /* 端侧小模型（Lisa）说的话：用蓝色和"你说的"区分开 */
        #lisa-say .c-lisa-step_dialog.is-lisa {
            color: #1a73e8
        }

        #lisa-say .c-lisa-step_dialog:last-child {
            margin-bottom: 0
        }
    </style>

    <link id="main-css" rel="stylesheet" href="./main.css" media="all"
        onload="this.media='all'; this.onload=null; this.isLoaded=true;"
        onerror="window.__lisaCssFailed=1; this.isLoaded=true; if(!this.__errFired){this.__errFired=1; try{this.dispatchEvent(new Event('load'))}catch(e){var _e=document.createEvent('HTMLEvents');_e.initEvent('load',false,false);this.dispatchEvent(_e)}}">
</head>

<body>

    <div class="c-preloader" id="preloader">
        <div class="c-preloader_outer">
            <span class="c-preloader_logo" id="preloaderLogo"></span>
        </div>
        <span id="preloaderHead"></span>
        <span id="preloaderContent" style="display:none"></span>
    </div>

    <main>
        <div class="c-lisa is-compact">
            <!-- 环境音：同目录的 ambient.mp3（浏览器会拦截自动播放，首次点击后播放） -->
            <audio id="lisa-ambient" src="ambient.mp3" loop preload="auto"></audio>

            <!-- ======================================================================
                 Lisa 对白层（弹幕）：视觉完全复用 main.css 里原站的
                     .c-lisa_main / .c-lisa-step / .c-lisa-step_dialog / .-show-cursor 光标
                 行为：说话时从屏幕下方升起并实时显示草稿；说完一句用「乱码落定」定格，
                       停留几秒后收起；最多保留 3 行，新的一行往上顶（弹幕感）。
                 驱动逻辑在 asr.js 里（由 window 的 'lisa-voice' 事件驱动）
                 ====================================================================== -->
            <div class="c-lisa_main" id="lisa-say" aria-live="polite">
                <div class="c-lisa-step" id="lisa-say-step"></div>
            </div>

            <!-- 3D 人物模型：app.js 里的 LisaVisualizer 模块会把 canvas 挂载到该节点，
                 模型为同目录下的 lisa.glb，环境贴图为 envmap.exr，屏幕视频为 running_code.mp4 -->
            <div class="c-lisa_visualizer" data-module-lisa-visualizer></div>

            <!-- 声音开关：点它切换 ambient.mp3 的播放 / 停止（图标默认就有，脚本只负责切换）
                 注意：图标用 style="fill:#fff" 内联写死，main.css 里 svg{fill:...} 之类的规则覆盖不了它 -->
            <button type="button" id="lisa-sound" aria-label="Sound" title="Play"
                style="position:fixed;right:18px;bottom:18px;z-index:2147483647;width:48px;height:48px;padding:0;border:0;border-radius:50%;background:#000;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:box-shadow .2s ease">
                <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" style="fill:#fff">
                    <path d="M3.5 9h3.4l4.6-3.8v13.6L6.9 15H3.5z" />
                    <path d="M14.4 8.4a4.8 4.8 0 0 1 0 7.2l1.5 1.5a6.9 6.9 0 0 0 0-10.2z" />
                    <path d="M17.9 4.9a10 10 0 0 1 0 14.2l1.5 1.5a12.1 12.1 0 0 0 0-17.2z" />
                </svg>
            </button>

            <!-- 语音输入（VAD + ASR，纯前端）：
                 点过 “[CLICK] TO START”（页面首次点击 / 按键）之后自动打开麦克风并进入 VAD 常听状态：
                 一说话就自动开始识别、边说边出字，停顿约 0.8s 自动收句；再点这个按钮可随时关 / 开。
                 识别默认走本机离线模型（./vosk/，断网可用），实现全在 ./asr.js 里（不碰 app.js） -->
            <button type="button" id="lisa-voice" class="c-lisa_voice is-off" aria-label="语音输入已关闭"
                title="语音输入：点击开启">
                <svg id="lisa-voice-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z" />
                    <path
                        d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z" />
                </svg>
                <span class="c-lisa_voice-bars" id="lisa-voice-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            </button>

            <!-- 实时字幕：上一句（浅色）+ 本句定稿（白色）+ 草稿（灰色）+ 光标 -->
            <div class="c-lisa_voice-bar" id="lisa-voice-bar" aria-live="polite">
                <span class="c-lisa_voice-prev" id="lisa-voice-prev" style="display:none"></span><span
                    class="c-lisa_voice-final" id="lisa-voice-final"></span><span class="c-lisa_voice-draft"
                    id="lisa-voice-draft"></span><i class="c-lisa_voice-caret" aria-hidden="true"></i>
            </div>

            <!-- 语音出问题（权限被拒 / 连不上识别服务 / 浏览器不支持）时才出现的提示条，点一下关掉 -->
            <div class="c-lisa_voice-tip" id="lisa-voice-tip" role="alert"></div>
        </div>
    </main>

    <script>
        /* app.js 的启动流程依赖这两个 Promise（必需，且必须在 app.js 之前定义） */
        window.preloaderEnterPromise = new Promise(resolve => {
            setTimeout(resolve, 1200);
        });

        window.preloaderPromise = new Promise(resolve => {
            window.preloaderPromiseResolve = resolve;
        });
    </script>

    <!-- 声音：直接播放同目录的 ambient.mp3 -->
    <script>
        (function () {
            var audio = document.getElementById('lisa-ambient');
            var button = document.getElementById('lisa-sound');

            var ICON_ON = '<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" style="fill:#fff">' +
                '<path d="M3.5 9h3.4l4.6-3.8v13.6L6.9 15H3.5z"/>' +
                '<path d="M14.4 8.4a4.8 4.8 0 0 1 0 7.2l1.5 1.5a6.9 6.9 0 0 0 0-10.2z"/>' +
                '<path d="M17.9 4.9a10 10 0 0 1 0 14.2l1.5 1.5a12.1 12.1 0 0 0 0-17.2z"/></svg>';
            var ICON_OFF = '<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" style="fill:#fff">' +
                '<path d="M3.5 9h3.4l4.6-3.8v13.6L6.9 15H3.5z"/>' +
                '<g transform="rotate(45 19.4 12)"><rect x="18.45" y="7.4" width="1.9" height="9.2" rx=".95"/>' +
                '<rect x="14.8" y="11.05" width="9.2" height="1.9" rx=".95"/></g></svg>';

            function render() {
                var on = !audio.paused;
                button.innerHTML = on ? ICON_ON : ICON_OFF;
                button.style.boxShadow = on ? 'none' : 'inset 0 0 0 3px #fff';
                button.title = on ? 'Mute' : 'Play';
            }

            function play() {
                audio.muted = false;
                var p = audio.play();
                if (p && p.catch) p.catch(function (e) {
                    console.warn('[sound] play 失败：', e && e.name, audio.currentSrc || audio.src);
                });
            }

            /* 点按钮：正在响 → 停；没声音 → 播 */
            button.addEventListener('click', function () {
                if (audio.paused) play(); else audio.pause();
            });

            audio.addEventListener('play', render);
            audio.addEventListener('pause', render);

            /* 浏览器默认拦截自动播放：先试一次，被拦就在第一次点击页面（按钮除外）时再放 */
            play();
            document.addEventListener('pointerdown', function first(event) {
                if (button.contains(event.target)) return;
                document.removeEventListener('pointerdown', first, true);
                if (audio.paused) play();
            }, true);

            render();
        })();
    </script>

    <!-- =====================================================================
         启动自检（正常启动时完全看不到；只在启动失败时把原因显示在屏幕上）
         · 捕获 JS 报错，以及 main.css / vendors.js / app.js 的下载失败
         · 全部用 ES5 写：微信/QQ 内置浏览器这类旧内核也要能跑起来显示原因
         ===================================================================== -->
    <script>
        (function () {
            var problems = [];
            window.__lisaProblems = problems;

            function addProblem(msg) {
                for (var i = 0; i < problems.length; i++) { if (problems[i] === msg) { return; } }
                if (problems.length < 12) { problems.push(msg); }
            }
            window.__lisaAddProblem = addProblem;

            window.addEventListener('error', function (e) {
                var t = e && e.target;
                if (t && t !== window && t.tagName) {
                    if (t.tagName === 'SCRIPT') { addProblem('脚本加载失败：' + (t.src || 'inline')); return; }
                    if (t.tagName === 'LINK') { addProblem('样式加载失败：' + (t.href || '')); return; }
                }
                var msg = (e && (e.message || (e.error && e.error.message))) || '未知错误';
                var where = (e && e.filename) ? ('  @' + e.filename.split('/').pop() + ':' + e.lineno + ':' + e.colno) : '';
                addProblem('JS 报错：' + msg + where);
            }, true);

            window.addEventListener('unhandledrejection', function (e) {
                var r = e && e.reason;
                addProblem('未处理的 Promise 拒绝：' + ((r && (r.message || r.name)) || String(r)));
            });
        })();
    </script>

    <script>
        (function () {
            var t0 = new Date().getTime();
            var SHOW_AFTER = 25000;
            var timer = null;

            function row(label, value, ok) {
                var d = document.createElement('div');
                d.style.cssText = 'margin:2px 0;font:13px/1.7 Consolas,monospace;word-break:break-all;color:' +
                    (ok === false ? '#c62828' : ok === true ? '#2e7d32' : '#333');
                d.textContent = (ok === true ? '[OK] ' : ok === false ? '[FAIL] ' : '[--] ') + label + (value ? '：' + value : '');
                return d;
            }

            function title(txt) {
                var d = document.createElement('div');
                d.style.cssText = 'font-size:17px;font-weight:700;margin:0 0 10px';
                d.textContent = txt;
                return d;
            }

            function build(mode) {
                var box = document.createElement('div');
                box.id = 'lisa-selfcheck';
                box.style.cssText = 'position:fixed;left:0;right:0;top:0;bottom:0;z-index:2147483647;' +
                    'background:rgba(255,255,255,.97);color:#111;overflow:auto;-webkit-overflow-scrolling:touch;' +
                    'padding:18px 16px 48px;font:14px/1.75 system-ui,-apple-system,"Microsoft YaHei",sans-serif';
                box.appendChild(title(mode === 'slow'
                    ? '⏳ Lisa 页面还没启动完（资源还在加载，或浏览器不支持 WebGL）'
                    : '⚠ Lisa 页面没能启动 —— 这就是白屏的原因'));

                var res = window.__lisaRes || {};
                var cv = document.querySelector('.c-lisa_visualizer canvas');
                var cssOk = window.__lisaCssFailed ? false : true;
                box.appendChild(row('main.css（页面样式）', window.__lisaCssFailed ? '加载失败' : '已加载', cssOk));
                box.appendChild(row('vendors.js（兼容垫片）', res.vendors === 'fail' ? '加载失败' : (res.vendors === 'ok' ? '已加载' : '未完成'), res.vendors === 'fail' ? false : (res.vendors === 'ok' ? true : null)));
                box.appendChild(row('app.js（主程序 2.9MB）', res.appJs === 'fail' ? '加载失败' : (res.appJs === 'ok' ? '已加载' : '未完成'), res.appJs === 'fail' ? false : (res.appJs === 'ok' ? true : null)));
                box.appendChild(row('asr.js（语音输入 VAD+ASR）', res.asr === 'fail' ? '加载失败' : (res.asr === 'ok' ? '已加载' : '未完成'), res.asr === 'fail' ? false : (res.asr === 'ok' ? true : null)));
                box.appendChild(row('语音识别 API（Web Speech）', (window.SpeechRecognition || window.webkitSpeechRecognition) ? '可用' : '当前浏览器不支持', (window.SpeechRecognition || window.webkitSpeechRecognition) ? true : false));
                box.appendChild(row('llm.js（端侧 GPU 小模型）', res.llm === 'fail' ? '加载失败' : (res.llm === 'ok' ? '已加载' : '未完成'), res.llm === 'fail' ? false : (res.llm === 'ok' ? true : null)));
                box.appendChild(row('WebGPU（小模型要用的）', navigator.gpu ? '可用' : '当前浏览器不可用', !!navigator.gpu));
                box.appendChild(row('three.js 是否已执行', window.__THREE__ ? '是' : '否', window.__THREE__ ? true : false));
                box.appendChild(row('3D 画布', cv ? (cv.width + '×' + cv.height) : '没有', cv ? true : false));

                var problems = window.__lisaProblems || [];
                if (problems.length) {
                    var t = document.createElement('div');
                    t.style.cssText = 'margin:14px 0 4px;font-weight:700';
                    t.textContent = '捕获到的错误：';
                    box.appendChild(t);
                    for (var i = 0; i < problems.length; i++) { box.appendChild(row('', problems[i], false)); }
                }

                var ua = navigator.userAgent || '';
                box.appendChild(row('当前地址', location.href, null));
                box.appendChild(row('浏览器', ua, null));

                var tips = document.createElement('div');
                tips.style.cssText = 'margin:14px 0 0;padding:10px 12px;background:#f4f4f5;border-radius:8px;font-size:13px;line-height:1.8';
                var html = '<b>怎么排查：</b><br>1) 在手机浏览器直接打开<br>' +
                    '<span style="word-break:break-all">' + location.href.replace(/[^\/]*$/, 'app.js') + '</span><br>' +
                    '能出代码说明网络没问题，出不来就是资源被拦/被墙（换网络或改用局域网方式）；<br>' +
                    '2) 点下面按钮重新加载；<br>3) 若浏览器较旧，换系统自带浏览器（Safari / Chrome）打开。';
                if (/MicroMessenger|MQQBrowser|QQ\/|UCBrowser|Quark/i.test(ua)) {
                    html += '<br><b style="color:#c62828">你现在用的是微信/QQ/UC 内置浏览器，内核较旧，很可能解析不了这个页面的脚本 —— 请用系统自带浏览器打开同一地址。</b>';
                }
                tips.innerHTML = html;
                box.appendChild(tips);

                var btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = '重新加载';
                btn.style.cssText = 'margin-top:14px;padding:12px 22px;border:0;border-radius:999px;background:#111;color:#fff;font:15px/1 system-ui,sans-serif';
                btn.onclick = function () { location.reload(); };
                box.appendChild(btn);

                var old = document.getElementById('lisa-selfcheck');
                if (old && old.parentNode) { old.parentNode.removeChild(old); }
                document.body.appendChild(box);
            }

            function tick() {
                if (document.querySelector('.c-lisa_visualizer canvas')) {
                    var box = document.getElementById('lisa-selfcheck');
                    if (box && box.parentNode) { box.parentNode.removeChild(box); }
                    window.clearInterval(timer);
                    return;
                }
                if (new Date().getTime() - t0 > SHOW_AFTER) {
                    var res = window.__lisaRes || {};
                    build((res.appJs === 'fail' || window.__lisaCssFailed === 1) ? 'fail' : 'slow');
                }
            }

            timer = window.setInterval(tick, 700);
        })();
    </script>

    <script src="./vendors.js" defer
        onload="window.__lisaRes=(window.__lisaRes||{});window.__lisaRes.vendors='ok'"
        onerror="window.__lisaRes=(window.__lisaRes||{});window.__lisaRes.vendors='fail'"></script>
    <script src="./app.js" defer
        onload="window.__lisaRes=(window.__lisaRes||{});window.__lisaRes.appJs='ok'"
        onerror="window.__lisaRes=(window.__lisaRes||{});window.__lisaRes.appJs='fail'"></script>

    <!-- 语音输入（VAD + ASR，纯前端）：挂在 app.js 之后，只操作自己的 DOM，不影响 3D 的启动流程
         ?v= 这个小版本号是用来破浏览器"启发式缓存"的：脚本一改就把它加一，普通刷新也能拿到新版 -->
    <script src="./asr.js?v=3" defer
        onload="window.__lisaRes=(window.__lisaRes||{});window.__lisaRes.asr='ok'"
        onerror="window.__lisaRes=(window.__lisaRes||{});window.__lisaRes.asr='fail'"></script>

    <!-- 端侧 GPU 小模型（WebGPU / WebLLM，Qwen2.5-0.5B-Instruct q4f16）：
         引擎、WebGPU 计算库、模型权重全在 ./llm/ 里，断网可用；听到你说完一整句就用显卡生成回复 -->
    <script src="./llm.js?v=3" defer
        onload="window.__lisaRes=(window.__lisaRes||{});window.__lisaRes.llm='ok'"
        onerror="window.__lisaRes=(window.__lisaRes||{});window.__lisaRes.llm='fail'"></script>

    <script>
        /* 用 file:// 打开时浏览器会拦截本地音频/模型（控制台只有 NotSupportedError 和 403，看着像“按钮坏了”）。
           这里只在顶部放一条横幅提示，不遮住页面右下角的按钮。 */
        if (location.protocol === 'file:') {
            var tip = document.createElement('div');
            tip.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:21474836;padding:14px 20px;' +
                'background:rgba(0,0,0,.88);color:#fff;text-align:center;pointer-events:none;' +
                'font:14px/1.7 system-ui,-apple-system,"Microsoft YaHei",sans-serif';
            tip.innerHTML =
                '<b style="color:#ffd166">当前是 file:// 方式打开</b>，浏览器会拦掉本地音频 / 模型（所以按钮点了没声音，控制台是 NotSupportedError / 403）。　' +
                '正确做法：双击同目录的「启动本地服务.bat」，或在本目录执行 <code>python -m http.server 8000</code>，' +
                '然后打开 <code style="color:#8ecae6">http://127.0.0.1:8000/human.html</code>';
            document.body.appendChild(tip);
        }
    </script>
